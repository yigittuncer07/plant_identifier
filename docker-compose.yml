services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    ports:
      - "8081:8081"
    environment:
      # forces Expo's QR code to use your physical network IP instead of dockers
      - REACT_NATIVE_PACKAGER_HOSTNAME=192.168.1.31 
    volumes:
      - ./frontend:/app
      - /app/node_modules